; Default php.ini upload limits (2M) are too small for real photo uploads
; (cover artikel, foto pemain) — Laravel-side validation already allows up
; to 4MB (lihat StoreArticleRequest/UpdateArticleRequest), jadi batas PHP
; di sini dinaikkan biar tidak diam-diam nolak file sebelum sampai Laravel.
upload_max_filesize = 10M
post_max_size = 12M
