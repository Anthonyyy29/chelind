services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        env_file: .env
        volumes:
            - public-data:/var/www/html/public
            - storage-data:/var/www/html/storage/app/public
        depends_on:
            - mysql
        networks:
            - chelind

    # Jalanin scheduler Laravel (sync jadwal pertandingan tiap 15 menit) —
    # image sama kayak "app", cuma command-nya beda, jadi tidak perlu build ulang.
    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        env_file: .env
        entrypoint: [""]
        command: >
            sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
        depends_on:
            - app
        networks:
            - chelind

    # Internal-only: TIDAK expose port ke host. Cuma diakses container "npm"
    # lewat network Docker "chelind" (DNS otomatis by nama service: nginx:80).
    # SSL & routing publik sekarang ditangani "npm" (Nginx Proxy Manager) di
    # bawah, bukan di sini.
    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        volumes:
            - ./docker/nginx/templates:/etc/nginx/templates:ro
            - public-data:/var/www/html/public:ro
            - storage-data:/var/www/html/storage/app/public:ro
        depends_on:
            - app
        networks:
            - chelind

    # Reverse proxy publik + SSL, dikelola lewat UI (bukan certbot manual,
    # bukan Cloudflare Tunnel — cuma butuh 1 DNS A record biasa ke IP VPS,
    # nggak perlu kontrol nameserver domain).
    # UI admin (port 81) SENGAJA di-bind ke 127.0.0.1 saja — tidak pernah
    # bisa diakses langsung dari internet, biarpun firewall lupa diset.
    # Akses UI lewat SSH tunnel: ssh -L 8181:localhost:81 user@vps
    # lalu buka http://localhost:8181 di browser lokal. Lihat deploy/DEPLOY.md.
    npm:
        image: jc21/nginx-proxy-manager:latest
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
            - '127.0.0.1:81:81'
        volumes:
            - npm-data:/data
            - npm-letsencrypt:/etc/letsencrypt
        networks:
            - chelind

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - chelind

networks:
    chelind:
        driver: bridge

volumes:
    mysql-data:
    # Isinya di-refresh entrypoint.sh tiap "app" start, jadi aman kalau
    # kosong/basi — bukan tempat penyimpanan data permanen.
    public-data:
    # Ini beneran nyimpen file upload (cover artikel, foto pemain/transfer)
    # — TIDAK di-refresh, harus persist antar deploy.
    storage-data:
    # Data internal Nginx Proxy Manager: konfigurasi proxy host + sertifikat
    # Let's Encrypt yang diterbitkan lewat UI-nya. Harus persist antar deploy.
    npm-data:
    npm-letsencrypt:
