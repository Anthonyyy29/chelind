services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        env_file: .env
        volumes:
            - public-data:/var/www/html/public
            - storage-data:/var/www/html/storage/app/public
        depends_on:
            - mysql
        networks:
            - chelind

    # Jalanin scheduler Laravel (sync jadwal pertandingan tiap 15 menit) —
    # image sama kayak "app", cuma command-nya beda, jadi tidak perlu build ulang.
    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        env_file: .env
        entrypoint: [""]
        command: >
            sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
        depends_on:
            - app
        networks:
            - chelind

    # Internal-only: TIDAK expose port ke host. Cuma diakses container
    # "cloudflared" lewat network Docker "chelind" (DNS otomatis by nama
    # service: nginx:80). SSL & routing publik ditangani Cloudflare Tunnel
    # di bawah, bukan di sini.
    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        volumes:
            - ./docker/nginx/templates:/etc/nginx/templates:ro
            - public-data:/var/www/html/public:ro
            - storage-data:/var/www/html/storage/app/public:ro
        depends_on:
            - app
        networks:
            - chelind

    # Reverse proxy publik + SSL lewat Cloudflare Tunnel. VPS yang inisiasi
    # koneksi KELUAR ke Cloudflare — jadi TIDAK ADA port yang perlu dibuka
    # ke internet sama sekali (lihat deploy/DEPLOY.md untuk setup tunnel-nya
    # di dashboard Cloudflare: buat tunnel, isi TUNNEL_TOKEN di .env, lalu
    # arahkan Public Hostname ke "nginx:80").
    cloudflared:
        image: cloudflare/cloudflared:latest
        restart: unless-stopped
        command: tunnel run
        environment:
            TUNNEL_TOKEN: '${CLOUDFLARE_TUNNEL_TOKEN}'
        networks:
            - chelind

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - chelind

networks:
    chelind:
        driver: bridge

volumes:
    mysql-data:
    # Isinya di-refresh entrypoint.sh tiap "app" start, jadi aman kalau
    # kosong/basi — bukan tempat penyimpanan data permanen.
    public-data:
    # Ini beneran nyimpen file upload (cover artikel, foto pemain/transfer)
    # — TIDAK di-refresh, harus persist antar deploy.
    storage-data:
